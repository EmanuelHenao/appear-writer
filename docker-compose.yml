# Para Dokploy (tipo «Compose») o para correrlo en cualquier servidor:
#   docker compose up -d --build
services:
  appear-writer:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Contraseña de acceso. Sin ella la app queda abierta.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Opcionales: también se pueden poner desde la página de Ajustes.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    volumes:
      - appear-data:/data
    # Chromium necesita memoria compartida para libros grandes.
    shm_size: "1gb"

volumes:
  appear-data:
